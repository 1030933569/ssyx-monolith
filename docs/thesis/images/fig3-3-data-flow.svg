<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="740" viewBox="0 0 1250 740">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;fill:#12213a}
      .title{font-size:24px;font-weight:700}
      .label{font-size:16px}
      .small{font-size:13px;fill:#475569}
      .page{fill:#fff;stroke:#dbe4ef;stroke-width:1}
      .actor{fill:#f8fafc;stroke:#64748b;stroke-width:1.7}
      .process{fill:#edf6ff;stroke:#4b7fc6;stroke-width:1.8}
      .store{fill:#fff7ed;stroke:#dc4a12;stroke-width:1.8}
      .line{fill:none;stroke:#64748b;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .plain{fill:none;stroke:#64748b;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect x="1" y="1" width="1248" height="738" class="page"/>
  <text x="625" y="42" text-anchor="middle" class="title">系统数据流图</text>

  <rect x="60" y="90" width="150" height="70" rx="8" class="actor"/>
  <text x="135" y="131" text-anchor="middle" class="label">小程序用户</text>

  <rect x="60" y="640" width="150" height="62" rx="8" class="actor"/>
  <text x="135" y="677" text-anchor="middle" class="label">后台管理员</text>

  <rect x="300" y="82" width="220" height="78" rx="8" class="process"/>
  <text x="410" y="113" text-anchor="middle" class="label">登录与提货点</text>
  <text x="410" y="140" text-anchor="middle" class="small">登录凭证、用户令牌</text>

  <rect x="300" y="192" width="220" height="78" rx="8" class="process"/>
  <text x="410" y="223" text-anchor="middle" class="label">商品浏览</text>
  <text x="410" y="250" text-anchor="middle" class="small">分类、搜索、详情</text>

  <rect x="300" y="302" width="220" height="78" rx="8" class="process"/>
  <text x="410" y="333" text-anchor="middle" class="label">购物车处理</text>
  <text x="410" y="360" text-anchor="middle" class="small">添加、数量、勾选</text>

  <rect x="300" y="412" width="220" height="88" rx="8" class="process"/>
  <text x="410" y="444" text-anchor="middle" class="label">订单提交</text>
  <text x="410" y="471" text-anchor="middle" class="small">防重校验、库存锁定</text>
  <text x="410" y="490" text-anchor="middle" class="small">生成订单数据</text>

  <rect x="300" y="542" width="220" height="78" rx="8" class="process"/>
  <text x="410" y="573" text-anchor="middle" class="label">支付处理</text>
  <text x="410" y="600" text-anchor="middle" class="small">支付结果、状态推进</text>

  <rect x="300" y="640" width="220" height="62" rx="8" class="process"/>
  <text x="410" y="677" text-anchor="middle" class="label">后台数据维护</text>

  <rect x="850" y="82" width="250" height="78" rx="8" class="store"/>
  <text x="975" y="112" text-anchor="middle" class="label">Redis 登录缓存</text>
  <text x="975" y="139" text-anchor="middle" class="small">登录态、用户摘要信息</text>

  <rect x="680" y="192" width="210" height="78" rx="8" class="store"/>
  <text x="785" y="222" text-anchor="middle" class="label">MySQL 商品数据</text>
  <text x="785" y="249" text-anchor="middle" class="small">商品表、分类表</text>

  <rect x="940" y="192" width="190" height="78" rx="8" class="store"/>
  <text x="1035" y="222" text-anchor="middle" class="label">Redis 热度</text>
  <text x="1035" y="249" text-anchor="middle" class="small">热度分值</text>

  <rect x="850" y="302" width="250" height="78" rx="8" class="store"/>
  <text x="975" y="332" text-anchor="middle" class="label">Redis 购物车</text>
  <text x="975" y="359" text-anchor="middle" class="small">购物车项、勾选状态</text>

  <rect x="650" y="420" width="210" height="72" rx="8" class="store"/>
  <text x="755" y="449" text-anchor="middle" class="label">Redis 订单控制</text>
  <text x="755" y="474" text-anchor="middle" class="small">防重标记、库存锁</text>

  <rect x="930" y="420" width="230" height="72" rx="8" class="store"/>
  <text x="1045" y="449" text-anchor="middle" class="label">MySQL 订单数据</text>
  <text x="1045" y="474" text-anchor="middle" class="small">order_info、order_item</text>

  <rect x="670" y="542" width="220" height="78" rx="8" class="store"/>
  <text x="780" y="572" text-anchor="middle" class="label">payment_info</text>
  <text x="780" y="599" text-anchor="middle" class="small">支付记录、支付状态</text>

  <rect x="950" y="542" width="190" height="78" rx="8" class="store"/>
  <text x="1045" y="572" text-anchor="middle" class="label">order_info</text>
  <text x="1045" y="599" text-anchor="middle" class="small">订单状态更新</text>

  <rect x="850" y="640" width="250" height="62" rx="8" class="store"/>
  <text x="975" y="667" text-anchor="middle" class="label">MySQL 基础数据</text>
  <text x="975" y="690" text-anchor="middle" class="small">商品、订单、提货点、仓库</text>

  <path d="M210 125 H300" class="line"/>
  <path d="M410 160 V192" class="line"/>
  <path d="M410 270 V302" class="line"/>
  <path d="M410 380 V412" class="line"/>
  <path d="M410 500 V542" class="line"/>

  <path d="M520 121 H850" class="line"/>
  <path d="M520 231 H680" class="line"/>
  <path d="M520 214 H610 V175 H1035 V192" class="line"/>
  <path d="M520 341 H850" class="line"/>
  <path d="M520 456 H650" class="line"/>
  <path d="M860 456 H930" class="line"/>
  <path d="M520 581 H670" class="line"/>
  <path d="M890 581 H950" class="line"/>

  <path d="M210 671 H300" class="line"/>
  <path d="M520 671 H850" class="line"/>
</svg>
