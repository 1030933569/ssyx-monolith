<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","SimSun",Arial,sans-serif;fill:#12213a}
      .title{font-size:26px;font-weight:700}
      .section{font-size:16px;font-weight:700;fill:#475569}
      .entity{font-size:18px;font-weight:700}
      .field{font-size:15px}
      .card{font-size:17px;font-weight:700;fill:#1f2937}
      .label{font-size:13px;fill:#334155}
      .legend{font-size:14px;fill:#64748b}
      .page{fill:#fff;stroke:#dbe4ef;stroke-width:1}
      .zone{fill:#f8fafc;stroke:#d7e3f2;stroke-width:1.4}
      .table{fill:#fff;stroke:#3f73bd;stroke-width:1.8}
      .head{fill:#edf6ff;stroke:#3f73bd;stroke-width:1.8}
      .split{fill:none;stroke:#3f73bd;stroke-width:1.8}
      .rel{fill:none;stroke:#64748b;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
      .tag{fill:#fff;stroke:#d6dee9;stroke-width:1}
    </style>
  </defs>

  <rect x="1" y="1" width="1498" height="918" class="page"/>
  <text x="750" y="46" text-anchor="middle" class="title">数据库 ER 图</text>

  <rect x="45" y="72" width="1410" height="370" rx="8" class="zone"/>
  <text x="70" y="103" class="section">用户、提货点与仓配关系</text>

  <rect x="45" y="465" width="1410" height="410" rx="8" class="zone"/>
  <text x="70" y="496" class="section">订单、商品与支付关系</text>

  <!-- 1/N 表示实体之间的基数关系，不表示业务执行顺序。 -->
  <path d="M350 205 H420" class="rel"/>
  <path d="M720 205 H790" class="rel"/>
  <path d="M570 285 V330" class="rel"/>
  <path d="M720 382 H790" class="rel"/>

  <path d="M400 640 H585" class="rel"/>
  <path d="M245 730 V765" class="rel"/>
  <path d="M915 640 H1070" class="rel"/>

  <g id="relation-labels">
    <text x="363" y="199" class="card">1</text>
    <text x="405" y="199" class="card">N</text>
    <rect x="361" y="211" width="48" height="20" rx="4" class="tag"/>
    <text x="385" y="226" text-anchor="middle" class="label">绑定</text>

    <text x="733" y="199" class="card">N</text>
    <text x="774" y="199" class="card">1</text>
    <rect x="733" y="211" width="48" height="20" rx="4" class="tag"/>
    <text x="757" y="226" text-anchor="middle" class="label">提货点</text>

    <text x="544" y="306" class="card">N</text>
    <text x="544" y="329" class="card">1</text>
    <rect x="591" y="304" width="48" height="20" rx="4" class="tag"/>
    <text x="615" y="319" text-anchor="middle" class="label">仓库</text>

    <text x="733" y="376" class="card">1</text>
    <text x="774" y="376" class="card">N</text>
    <rect x="733" y="388" width="48" height="20" rx="4" class="tag"/>
    <text x="757" y="403" text-anchor="middle" class="label">区域仓</text>

    <text x="414" y="634" class="card">N</text>
    <text x="568" y="634" class="card">1</text>
    <rect x="474" y="616" width="56" height="20" rx="4" class="tag"/>
    <text x="502" y="631" text-anchor="middle" class="label">订单明细</text>

    <text x="220" y="748" class="card">N</text>
    <text x="220" y="765" class="card">1</text>
    <rect x="276" y="744" width="48" height="20" rx="4" class="tag"/>
    <text x="300" y="759" text-anchor="middle" class="label">商品</text>

    <text x="930" y="634" class="card">1</text>
    <text x="1052" y="634" class="card">1</text>
    <rect x="972" y="616" width="56" height="20" rx="4" class="tag"/>
    <text x="1000" y="631" text-anchor="middle" class="label">支付记录</text>
  </g>

  <g id="user">
    <rect x="90" y="130" width="260" height="155" rx="7" class="table"/>
    <rect x="90" y="130" width="260" height="40" rx="7" class="head"/>
    <path d="M90 170 H350" class="split"/>
    <text x="220" y="157" text-anchor="middle" class="entity">user</text>
    <text x="114" y="200" class="field">id 用户编号</text>
    <text x="114" y="226" class="field">nick_name 用户昵称</text>
    <text x="114" y="252" class="field">phone 联系电话</text>
    <text x="114" y="278" class="field">open_id 微信标识</text>
  </g>

  <g id="user_delivery">
    <rect x="420" y="130" width="300" height="155" rx="7" class="table"/>
    <rect x="420" y="130" width="300" height="40" rx="7" class="head"/>
    <path d="M420 170 H720" class="split"/>
    <text x="570" y="157" text-anchor="middle" class="entity">user_delivery</text>
    <text x="444" y="200" class="field">id 记录编号</text>
    <text x="444" y="226" class="field">user_id 用户编号</text>
    <text x="444" y="252" class="field">leader_id 提货点编号</text>
    <text x="444" y="278" class="field">ware_id 仓库编号</text>
  </g>

  <g id="leader">
    <rect x="790" y="130" width="260" height="155" rx="7" class="table"/>
    <rect x="790" y="130" width="260" height="40" rx="7" class="head"/>
    <path d="M790 170 H1050" class="split"/>
    <text x="920" y="157" text-anchor="middle" class="entity">leader</text>
    <text x="814" y="200" class="field">id 提货点编号</text>
    <text x="814" y="226" class="field">user_id 团长用户</text>
    <text x="814" y="252" class="field">take_name 提货点名称</text>
    <text x="814" y="278" class="field">region_id 所属区域</text>
  </g>

  <g id="ware">
    <rect x="420" y="330" width="300" height="100" rx="7" class="table"/>
    <rect x="420" y="330" width="300" height="40" rx="7" class="head"/>
    <path d="M420 370 H720" class="split"/>
    <text x="570" y="357" text-anchor="middle" class="entity">ware</text>
    <text x="444" y="400" class="field">id 仓库编号</text>
    <text x="444" y="426" class="field">name 仓库名称</text>
  </g>

  <g id="region_ware">
    <rect x="790" y="330" width="260" height="100" rx="7" class="table"/>
    <rect x="790" y="330" width="260" height="40" rx="7" class="head"/>
    <path d="M790 370 H1050" class="split"/>
    <text x="920" y="357" text-anchor="middle" class="entity">region_ware</text>
    <text x="814" y="400" class="field">region 区域编码</text>
    <text x="814" y="426" class="field">ware_id 仓库编号</text>
  </g>

  <g id="order_item">
    <rect x="90" y="555" width="310" height="175" rx="7" class="table"/>
    <rect x="90" y="555" width="310" height="40" rx="7" class="head"/>
    <path d="M90 595 H400" class="split"/>
    <text x="245" y="582" text-anchor="middle" class="entity">order_item</text>
    <text x="114" y="625" class="field">id 明细编号</text>
    <text x="114" y="651" class="field">order_id 订单主键</text>
    <text x="114" y="677" class="field">sku_id 商品编号</text>
    <text x="114" y="703" class="field">sku_num 购买数量</text>
  </g>

  <g id="order_info">
    <rect x="585" y="520" width="330" height="220" rx="7" class="table"/>
    <rect x="585" y="520" width="330" height="40" rx="7" class="head"/>
    <path d="M585 560 H915" class="split"/>
    <text x="750" y="547" text-anchor="middle" class="entity">order_info</text>
    <text x="610" y="590" class="field">id 订单主键</text>
    <text x="610" y="616" class="field">order_no 订单编号</text>
    <text x="610" y="642" class="field">user_id 用户编号</text>
    <text x="610" y="668" class="field">leader_id 提货点编号</text>
    <text x="610" y="694" class="field">ware_id 仓库编号</text>
    <text x="610" y="720" class="field">order_status 订单状态</text>
  </g>

  <g id="payment_info">
    <rect x="1070" y="555" width="315" height="175" rx="7" class="table"/>
    <rect x="1070" y="555" width="315" height="40" rx="7" class="head"/>
    <path d="M1070 595 H1385" class="split"/>
    <text x="1227.5" y="582" text-anchor="middle" class="entity">payment_info</text>
    <text x="1094" y="625" class="field">id 支付记录编号</text>
    <text x="1094" y="651" class="field">order_no 订单编号</text>
    <text x="1094" y="677" class="field">payment_status 支付状态</text>
    <text x="1094" y="703" class="field">trade_no 交易流水</text>
  </g>

  <g id="sku_info">
    <rect x="90" y="765" width="310" height="100" rx="7" class="table"/>
    <rect x="90" y="765" width="310" height="40" rx="7" class="head"/>
    <path d="M90 805 H400" class="split"/>
    <text x="245" y="792" text-anchor="middle" class="entity">sku_info</text>
    <text x="114" y="835" class="field">id 商品编号</text>
    <text x="114" y="861" class="field">sku_name 商品名称</text>
  </g>

  <text x="1385" y="850" text-anchor="end" class="legend">说明：1 表示一条主表记录，N 表示多条关联记录</text>
</svg>
