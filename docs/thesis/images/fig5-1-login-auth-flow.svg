<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#444"/></marker></defs>
  <rect width="1080" height="360" fill="#fff"/>
  <style>
    text{font-family:"Microsoft YaHei","SimSun",sans-serif;font-size:17px;fill:#222}
    .title{font-size:22px;font-weight:700}
    .node{fill:#f7fbff;stroke:#2f6f9f;stroke-width:2}
    .store{fill:#fffaf4;stroke:#9f6b2f;stroke-width:2}
    .line{stroke:#444;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
  </style>
  <text x="540" y="36" text-anchor="middle" class="title">用户登录与认证实现流程图</text>
  <rect x="45" y="120" width="140" height="70" rx="8" class="node"/><text x="115" y="162" text-anchor="middle">小程序端</text>
  <rect x="245" y="120" width="180" height="70" rx="8" class="node"/><text x="335" y="162" text-anchor="middle">WeixinApiController</text>
  <rect x="485" y="120" width="170" height="70" rx="8" class="node"/><text x="570" y="162" text-anchor="middle">用户查询/创建</text>
  <rect x="715" y="120" width="140" height="70" rx="8" class="store"/><text x="785" y="162" text-anchor="middle">Redis 登录态</text>
  <rect x="915" y="120" width="130" height="70" rx="8" class="node"/><text x="980" y="151" text-anchor="middle">返回令牌</text><text x="980" y="174" text-anchor="middle">Token</text>
  <rect x="420" y="255" width="250" height="62" rx="8" class="node"/><text x="545" y="292" text-anchor="middle">UserLoginInterceptor 解析令牌</text>
  <rect x="745" y="255" width="240" height="62" rx="8" class="node"/><text x="865" y="292" text-anchor="middle">AuthContextHolder 保存用户上下文</text>
  <line x1="185" y1="155" x2="245" y2="155" class="line"/>
  <line x1="425" y1="155" x2="485" y2="155" class="line"/>
  <line x1="655" y1="155" x2="715" y2="155" class="line"/>
  <line x1="855" y1="155" x2="915" y2="155" class="line"/>
  <line x1="980" y1="190" x2="545" y2="255" class="line"/>
  <line x1="670" y1="286" x2="745" y2="286" class="line"/>
</svg>
