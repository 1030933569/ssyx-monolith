<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#444"/></marker></defs>
  <rect width="1080" height="380" fill="#fff"/>
  <style>
    text{font-family:"Microsoft YaHei","SimSun",sans-serif;font-size:17px;fill:#222}
    .title{font-size:22px;font-weight:700}
    .node{fill:#f7fbff;stroke:#2f6f9f;stroke-width:2}
    .store{fill:#fffaf4;stroke:#9f6b2f;stroke-width:2}
    .line{stroke:#444;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
  </style>
  <text x="540" y="36" text-anchor="middle" class="title">购物车功能实现流程图</text>
  <rect x="55" y="130" width="135" height="65" rx="8" class="node"/><text x="122" y="169" text-anchor="middle">添加商品</text>
  <rect x="250" y="130" width="170" height="65" rx="8" class="node"/><text x="335" y="169" text-anchor="middle">生成购物车 Key</text>
  <rect x="480" y="80" width="180" height="65" rx="8" class="store"/><text x="570" y="119" text-anchor="middle">读取商品信息</text>
  <rect x="480" y="195" width="180" height="65" rx="8" class="store"/><text x="570" y="234" text-anchor="middle">Redis Hash</text>
  <rect x="725" y="130" width="150" height="65" rx="8" class="node"/><text x="800" y="169" text-anchor="middle">数量/勾选更新</text>
  <rect x="930" y="130" width="120" height="65" rx="8" class="node"/><text x="990" y="169" text-anchor="middle">设置过期</text>
  <rect x="355" y="300" width="370" height="55" rx="8" class="node"/><text x="540" y="334" text-anchor="middle">订单确认时读取已勾选购物车项</text>
  <line x1="190" y1="162" x2="250" y2="162" class="line"/>
  <line x1="420" y1="155" x2="480" y2="115" class="line"/>
  <line x1="420" y1="170" x2="480" y2="225" class="line"/>
  <line x1="660" y1="225" x2="725" y2="170" class="line"/>
  <line x1="875" y1="162" x2="930" y2="162" class="line"/>
  <line x1="570" y1="260" x2="540" y2="300" class="line"/>
</svg>
